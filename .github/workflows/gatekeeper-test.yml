name: Performance Regression Test Bench

on:
  pull_request:
    branches: [ main ]

jobs:
  run-performance-gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Latency Validation
        run: |
          curl -X POST "https://europe-west1-deploymentmonitor.cloudfunctions.net/gatekeeperOrchestrator" \
          -H "Content-Type: application/json" \
          -d '{
            "target_url": "https://httpbin.org/delay/0",
            "repo_owner": "${{ github.repository_owner }}",
            "repo_name": "${{ github.event.repository.name }}",
            "pr_number": ${{ github.event.pull_request.number }}
          }'